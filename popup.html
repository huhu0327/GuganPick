<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOOP 구간 재생 설정</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">SOOP 구간 재생</span>
    <span class="ready"><span aria-hidden="true"></span>READY</span>
  </header>

  <main>
    <div class="intro">
      <h1>재생 설정</h1>
      <p>구간 목록을 열기 전에 시청 흐름을 정합니다.</p>
    </div>

    <form id="settings-form">
      <section class="setting-group" aria-labelledby="flow-title">
        <h2 id="flow-title">재생 흐름</h2>

        <label class="setting-row" for="auto-play-first">
          <span>
            <strong>첫 구간 자동 재생</strong>
            <small>SOOP 페이지에서 첫 구간을 바로 재생합니다.</small>
          </span>
          <input id="auto-play-first" name="autoPlayFirst" type="checkbox" role="switch">
        </label>

        <label class="setting-row" for="pause-at-end">
          <span>
            <strong>구간마다 멈추기</strong>
            <small>재생한 구간의 종료점에서 멈춥니다.</small>
          </span>
          <input id="pause-at-end" name="pauseAtEnd" type="checkbox" role="switch">
        </label>

        <label class="setting-row" for="pause-at-last">
          <span>
            <strong>마지막 구간 멈추기</strong>
            <small>마지막 구간의 종료점에서 멈춥니다.</small>
          </span>
          <input id="pause-at-last" name="pauseAtLast" type="checkbox" role="switch">
        </label>

        <label class="setting-row" for="open-new-tab">
          <span>
            <strong>새 탭에서 영상 열기</strong>
            <small>끄면 현재 탭에서 SOOP으로 이동합니다.</small>
          </span>
          <input id="open-new-tab" name="openInNewTab" type="checkbox" role="switch">
        </label>

        <label class="setting-row" for="auto-open-panel">
          <span>
            <strong>SOOP에서 패널 자동 열기</strong>
            <small>재생 페이지 이동 후 목록을 바로 표시합니다.</small>
          </span>
          <input id="auto-open-panel" name="autoOpenPanel" type="checkbox" role="switch">
        </label>
      </section>

    </form>
  </main>

  <footer class="action-bar">
    <button id="open-panel" type="button">
      <span class="button-label">현재 페이지 패널 열기</span>
    </button>
    <p id="status" role="status" aria-live="polite">변경 사항은 자동 저장됩니다.</p>
  </footer>

  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
